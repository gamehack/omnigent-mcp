name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      OMNIGENT_URL: http://127.0.0.1:6767
      OMNIGENT_DEVICE_CLIENT_ID: ci-test
      OMNIGENT_TOKEN_FILE: /tmp/omnigent-mcp-token.json
      MCP_HOST: 127.0.0.1
      MCP_PORT: 8787
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile Python sources
        run: python -m compileall -q local_oauth.py setup_oauth.py client.py server.py bootstrap_device.py tests
      - name: Import private local MCP server
        env:
          MCP_AUTH_MODE: private
        run: python -c "import server; print('Private MCP server import OK')"
      - name: Import embedded OAuth MCP server
        env:
          MCP_AUTH_MODE: local-oauth
          MCP_ISSUER_URL: https://omnigent-mcp.example.test
          MCP_OAUTH_DB: /tmp/omnigent-oauth-ci.sqlite3
          MCP_OAUTH_CONFIG: /tmp/omnigent-owner-ci.json
          MCP_RESOURCE_URL: https://omnigent-mcp.example.test/mcp
        run: python -c "import server; print('Embedded OAuth MCP server import OK')"
      - name: Run unit tests
        run: python -m pytest -q
